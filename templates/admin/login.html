<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CJ Muebles — Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;
  display:grid;place-items:center;padding:20px}
.caja{background:#161616;border:1px solid #222;border-radius:24px;padding:36px 28px;
  width:min(92vw,400px);box-shadow:0 8px 32px rgba(0,0,0,.5)}
.logo{font-size:1.6rem;font-weight:900;text-align:center;margin-bottom:6px;
  background:linear-gradient(135deg,#667eea,#f093fb);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:#a0a0a0;font-size:.85rem;margin-bottom:24px}
label{display:block;font-size:.78rem;color:#a0a0a0;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:13px 16px;background:#1c1c1c;border:1px solid #2a2a2a;
  border-radius:12px;color:#fff;font-size:1rem;font-family:inherit;outline:none;transition:.2s}
input:focus{border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.15)}
button{width:100%;margin-top:22px;padding:14px;border:none;border-radius:12px;
  background:linear-gradient(135deg,#667eea,#f093fb);color:#fff;font-weight:800;
  font-size:1rem;cursor:pointer;font-family:inherit;transition:.2s}
button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(102,126,234,.35)}
.error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#f87171;
  padding:10px 14px;border-radius:10px;font-size:.85rem;margin-bottom:6px;text-align:center}
</style>
</head>
<body>
<form class="caja" method="post" action="/admin/login">
  <div class="logo">🪑 CJ Muebles</div>
  <div class="sub">Panel de administración</div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <label>Usuario</label>
  <input name="usuario" required autofocus autocomplete="username">
  <label>Clave</label>
  <input type="password" name="clave" required autocomplete="current-password">
  <button type="submit">Ingresar</button>
</form>
</body>
</html>
